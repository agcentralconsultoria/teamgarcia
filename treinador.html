<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamGarcia · Treinador</title>
<link rel="icon" href="icons/icon-192.png?v=20261116b">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20261116b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261116b">
<style>
  .layout { display: flex; min-height: 100vh; }
  body.nologin .side, body.nologin .mobile-top { display: none !important; }
  :root { --radius: 10px; --display: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  html[data-theme="light"] { --bg: #f3f4f6; --bg2: #ffffff; --card: #ffffff; --card2: #eceef1; --line: #d9dde3; --text: #16181c; --muted: #5d6471; --accent-ink: #ffffff; --shadow: 0 8px 24px rgba(0,0,0,.12); }
  html[data-theme="light"] .btn.primary { color: #fff; }
  .btn, .btn.sm { border-radius: 8px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; }
  .brand img { width: 44px; height: 44px; border-radius: 50%; }
  /* Menu fino só com ícones */
  .side { width: 58px; flex: none; background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; margin: 10px 0 10px 10px; padding: 10px 7px; position: sticky; top: 10px; height: calc(100vh - 20px); z-index: 40; display: flex; flex-direction: column; gap: 4px; }
  .rail-logo { display: grid; place-items: center; margin-bottom: 10px; }
  .rail-logo img { width: 42px; height: 42px; border-radius: 50%; }
  .rail-logo b { display: none; }
  .rail-item { position: relative; }
  .rail-btn { width: 42px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: var(--text); text-decoration: none; }
  .rail-btn:hover { background: var(--card2); }
  .rail-item.on .rail-btn { background: rgba(242,107,33,.16); color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .rail-label { display: none; }
  .rail-sep { flex: 1; }
  .fly { display: none; position: absolute; left: 100%; top: 0; padding-left: 12px; z-index: 60; }
  .rail-item:hover .fly, .rail-item.open .fly { display: block; }
  .fly-in { min-width: 230px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: var(--shadow); }
  .fly-in button, .fly-in a { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--text); text-decoration: none; white-space: nowrap; }
  .fly-in button:hover, .fly-in a:hover { background: var(--card2); }
  .fly-in button.on { color: var(--accent); }
  /* Barra do topo */
  .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin: -6px 0 10px; }
  .theme-sw { width: 46px; height: 24px; border-radius: 99px; background: #2563eb; position: relative; flex: none; }
  .theme-sw i { position: absolute; top: 2px; left: 24px; width: 20px; height: 20px; border-radius: 50%; background: #fff; color: #1e3a8a; display: grid; place-items: center; transition: left .2s; }
  .theme-sw i svg { width: 13px; height: 13px; }
  .theme-sw.light { background: #f59e0b; } .theme-sw.light i { left: 2px; color: #b45309; }
  .top-ico { position: relative; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--text); }
  .top-ico:hover { background: var(--card2); }
  .top-ico .badge { position: absolute; top: -2px; right: -4px; background: #b91c1c; color: #fff; border-radius: 99px; font-size: 10.5px; font-weight: 700; min-width: 17px; height: 17px; display: grid; place-items: center; padding: 0 4px; }
  .top-user { display: flex; align-items: center; gap: 10px; text-align: left; }
  .top-name { display: flex; flex-direction: column; line-height: 1.2; }
  .top-user img { width: 38px; height: 38px; border-radius: 50%; }
  .page-title { display: flex; align-items: center; gap: 10px; color: var(--text); }
  .pt-ico { display: inline-grid; place-items: center; color: var(--muted); }
  .pt-ico svg { width: 26px; height: 26px; }
  .kpi { padding: 14px 16px; min-height: 104px; display: flex; flex-direction: column; justify-content: space-between; }
  .card.kpi:hover { border-color: var(--accent); }
  .main { flex: 1; min-width: 0; padding: 22px 26px 60px; }
  .page-title { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .kpi b { display: block; font-size: 28px; font-weight: 800; margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  table.t { width: 100%; border-collapse: collapse; }
  table.t th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  table.t td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--card2); }
  .subtabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin: 16px 0; overflow-x: auto; }
  .subtabs button { padding: 10px 15px; font-weight: 600; font-size: 14px; color: var(--text); background: var(--bg2); border: 1px solid var(--line); border-bottom: 2px solid transparent; border-radius: 8px 8px 0 0; margin-right: -1px; white-space: nowrap; }
  .subtabs button.on { color: var(--accent); border-bottom-color: var(--accent); background: var(--card); }
  .ed-item { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .ed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .ed-grid .field label { font-size: 11.5px; margin-bottom: 4px; }
  .ed-grid input, .ed-grid select { padding: 7px 9px; font-size: 13.5px; }
  .tline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .icon-btn { width: 32px; height: 32px; border-radius: 9px; background: var(--card2); border: 1px solid var(--line); display: inline-grid; place-items: center; font-size: 14px; flex: none; }
  .days { display: flex; gap: 4px; flex-wrap: wrap; }
  .days button { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card2); font-size: 12.5px; font-weight: 600; }
  .days button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .vol { display: flex; flex-wrap: wrap; gap: 6px; }
  .sticky-save { position: sticky; bottom: 12px; z-index: 5; display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .sticky-save .card { display: flex; gap: 10px; align-items: center; padding: 10px 12px; box-shadow: var(--shadow); }
  .mobile-top { display: none; }
  .ph { width: 90px; aspect-ratio: 3/4; border-radius: 10px; background: var(--card2) center/cover; border: 1px solid var(--line); }
  .multi { max-height: 150px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
  .multi label { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; }
  .multi input { width: auto; }
  .kan { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
  .kan-col { flex: 0 0 260px; background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
  .kan-col h4 { margin: 0 0 8px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .kan-card { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; margin-bottom: 8px; }
  .tagp { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #fff; margin: 2px 3px 0 0; }
  .calm { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calm .h { text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; padding: 4px 0; }
  .calm .d { min-height: 70px; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 4px; font-size: 11px; text-align: left; cursor: pointer; }
  .calm .d.out { opacity: .3; }
  .calm .d.today { border-color: var(--accent); }
  .calm .d b { display: block; text-align: right; font-weight: 600; color: var(--muted); }
  .calm .d .evc { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: 10.5px; font-weight: 700; margin: 4px 3px 0 0; }
  .calm .d .ev { display: block; border-radius: 4px; padding: 1px 4px; margin-top: 2px; color: #fff; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .adh { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; }
  .adh span { padding: 8px 0; border-radius: 8px; background: var(--card2); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cmp img { width: 100%; border-radius: 12px; }
  .chg { border-left: 3px solid var(--accent); padding: 4px 10px; margin: 6px 0; }
  @media (max-width: 860px) {
    .side { position: fixed; left: -280px; top: 0; margin: 0; height: 100vh; width: 264px; border-radius: 0; transition: left .2s; box-shadow: var(--shadow); overflow-y: auto; padding: 14px 10px; }
    .side.open { left: 0; }
    .rail-logo { display: flex; align-items: center; gap: 10px; justify-content: flex-start; padding: 0 6px; }
    .rail-logo b { display: inline; font-size: 16px; }
    .rail-btn { width: 100%; display: flex; align-items: center; justify-content: flex-start; gap: 12px; padding: 0 10px; font-weight: 700; }
    .rail-label { display: inline; }
    .fly { display: block; position: static; padding: 0 0 4px 34px; }
    .rail-item .fly-in { min-width: 0; background: none; border: 0; box-shadow: none; padding: 0; }
    .rail-item:not(:has(.fly-in button + button)) .fly { display: none; }
    .fly-in button, .fly-in a { padding: 7px 10px; font-size: 13.5px; color: var(--muted); white-space: normal; }
    .topbar { gap: 10px; margin: 0 0 8px; }
    .top-name { display: none; }
    .calm .d .evc { min-width: 14px; height: 14px; font-size: 9px; margin: 2px 1px 0 0; }
    .mobile-top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg2); position: sticky; top: 0; z-index: 30; }
    .main { padding: 16px 16px 60px; }
    .grid2 { grid-template-columns: 1fr; }
    table.t .hide-m { display: none; }
    .kpis { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .kpi b { font-size: 22px; }
    .calm .d { min-height: 46px; font-size: 10px; padding: 2px; }
    .calm .d .ev { font-size: 0; height: 6px; padding: 0; }
  }
</style>
</head>
<body>
<div class="mobile-top"><button class="icon-btn" data-act="menu">☰</button><b>TeamGarcia · Treinador</b></div>
<div class="layout"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<div id="modal"></div>
<script src="shared.js?v=20261116b"></script>
<script src="tr-core.js?v=20261116b"></script>
<script src="tr-editores.js?v=20261116b"></script>
<script src="tr-extra.js?v=20261116b"></script>
<script src="tr-paginas.js?v=20261116b"></script>
<script src="tr-shell.js?v=20261116b"></script>
<script type="module" src="fb.js?v=20261116b"></script>
</body>
</html>
